name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y dpkg fakeroot rpm
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          cd /tmp && ./appimagetool --appimage-extract &>/dev/null
          echo "/tmp/squashfs-root/usr/bin" >> $GITHUB_PATH

      - name: Bump version
        id: version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          CURRENT=$(node -p "require('./package.json').version")
          if git ls-remote --tags origin "v$CURRENT" | grep -q .; then
            npm version patch -m "chore: bump version to %s [skip ci]"
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
            echo "bumped=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v$CURRENT not found upstream — releasing current version"
            echo "NEW_VERSION=$CURRENT" >> $GITHUB_ENV
            echo "bumped=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Linux packages (deb, rpm, zip)
        run: npm run make
        env:
          QA_RPATHS: 2

      - name: Build AppImage
        run: |
          PACKAGE_DIR=$(ls -d out/*-linux-x64 | head -1)
          if [ -z "$PACKAGE_DIR" ]; then
            echo "No packaged app directory found in out/"
            ls out/
            exit 1
          fi
          export LD_LIBRARY_PATH="/tmp/squashfs-root/usr/lib:${LD_LIBRARY_PATH:-}"
          bash scripts/make-appimage.sh "$PACKAGE_DIR"

      - name: Generate latest-linux.yml
        run: |
          APPIMAGE="out/Fynix_Hub-${NEW_VERSION}-x86_64.AppImage"
          if [ -f "$APPIMAGE" ]; then
            SIZE=$(stat -c%s "$APPIMAGE")
            SHA512=$(sha512sum "$APPIMAGE" | cut -d' ' -f1 | xxd -r -p | base64 -w0)
            DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
            printf 'version: %s\nfiles:\n  - url: %s\n    sha512: %s\n    size: %s\npath: %s\nsha512: %s\nreleaseDate: %s\n' \
              "${NEW_VERSION}" \
              "Fynix_Hub-${NEW_VERSION}-x86_64.AppImage" \
              "${SHA512}" "${SIZE}" \
              "Fynix_Hub-${NEW_VERSION}-x86_64.AppImage" \
              "${SHA512}" "${DATE}" \
              > out/latest-linux.yml
            echo "Generated latest-linux.yml for v${NEW_VERSION}"
          else
            echo "AppImage not found at $APPIMAGE, skipping latest-linux.yml"
          fi

      - name: Push version bump commit and tag
        if: steps.version.outputs.bumped == 'true'
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin v${{ env.NEW_VERSION }}
          git push origin HEAD:ci/version-${{ env.NEW_VERSION }} --force
          gh pr create \
            --base master \
            --head ci/version-${{ env.NEW_VERSION }} \
            --title "chore: bump version to ${{ env.NEW_VERSION }}" \
            --body "Automated version bump from CI."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: v${{ env.NEW_VERSION }}
          files: |
            out/make/**/*
            out/*.AppImage
            out/latest-linux.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
