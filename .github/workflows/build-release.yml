name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y dpkg fakeroot rpm
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          cd /tmp && ./appimagetool --appimage-extract &>/dev/null
          echo "/tmp/squashfs-root/usr/bin" >> $GITHUB_PATH

      - name: Bump version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          npm version patch -m "chore: bump version to %s [skip ci]"
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Build Linux packages (deb, rpm, zip)
        run: npm run make
        env:
          QA_RPATHS: 2

      - name: Build AppImage
        run: |
          PACKAGE_DIR=$(ls -d out/*-linux-x64 | head -1)
          if [ -z "$PACKAGE_DIR" ]; then
            echo "No packaged app directory found in out/"
            ls out/
            exit 1
          fi
          export LD_LIBRARY_PATH="/tmp/squashfs-root/usr/lib:${LD_LIBRARY_PATH:-}"
          bash scripts/make-appimage.sh "$PACKAGE_DIR"

      - name: Push version bump commit and tag
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin v${{ env.NEW_VERSION }}
          git push origin HEAD:ci/version-${{ env.NEW_VERSION }}
          gh pr create \
            --base master \
            --head ci/version-${{ env.NEW_VERSION }} \
            --title "chore: bump version to ${{ env.NEW_VERSION }}" \
            --body "Automated version bump from CI."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: v${{ env.NEW_VERSION }}
          files: |
            out/make/**/*
            out/*.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
