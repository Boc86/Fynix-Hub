name: Build & Deploy Flatpak

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Flatpak SDK & runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          flatpak install --user -y flathub org.electronjs.Electron2.BaseApp//24.08 || true

      - name: Build Flatpak bundle
        run: TMPDIR=/var/tmp npm run make:flatpak

      - name: Upload flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: out/make/flatpak/x86_64/*.flatpak

      - name: Import GPG key
        run: |
          if [ -z "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "GPG_PRIVATE_KEY is empty, skipping key import."
            exit 0
          fi
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --passphrase "${{ secrets.GPG_PASSPHRASE }}" || true
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye || true

      - name: Build OSTree repo
        run: |
          BUNDLE=$(find out/make -name "*.flatpak" | head -1)
          echo "Bundle path: $BUNDLE"

          if [ -z "$BUNDLE" ]; then
            echo "ERROR: No flatpak bundle found."
            ls -la out/make/ 2>/dev/null || true
            exit 1
          fi

          if [ ! -f "$BUNDLE" ]; then
            echo "ERROR: Bundle file does not exist: $BUNDLE"
            exit 1
          fi

          BUNDLE_SIZE=$(stat -c%s "$BUNDLE" 2>/dev/null || stat -f%z "$BUNDLE" 2>/dev/null)
          echo "Bundle size: $BUNDLE_SIZE bytes"

          if [ -z "$BUNDLE_SIZE" ] || [ "$BUNDLE_SIZE" -lt 1000 ]; then
            echo "ERROR: Bundle size suspiciously small, aborting"
            exit 1
          fi

          mkdir -p flatpak-repo
          ostree init --mode=archive-z2 --repo=flatpak-repo/repo

          GPG_KEY_ID="${{ secrets.GPG_KEY_ID }}"
          GPG_PASSPHRASE="${{ secrets.GPG_PASSPHRASE }}"

          if [ -n "$GPG_KEY_ID" ]; then
            KEYGRIP=$(gpg --list-secret-keys --with-keygrip "$GPG_KEY_ID" 2>/dev/null | grep Keygrip | head -1 | awk '{print $3}') || true
            if [ -n "$KEYGRIP" ] && [ -n "$GPG_PASSPHRASE" ]; then
              echo "$GPG_PASSPHRASE" | /usr/lib/gnupg2/gpg-preset-passphrase --preset "$KEYGRIP" 2>/dev/null || true
            fi
            flatpak build-import-bundle --gpg-sign="$GPG_KEY_ID" flatpak-repo/repo "$BUNDLE" 2>&1 || {
              echo "GPG import failed, retrying without GPG..."
              flatpak build-import-bundle flatpak-repo/repo "$BUNDLE" 2>&1
            }
            flatpak build-update-repo --gpg-sign="$GPG_KEY_ID" --generate-static-deltas flatpak-repo/repo 2>&1 || {
              echo "GPG update failed, retrying without GPG..."
              flatpak build-update-repo --generate-static-deltas flatpak-repo/repo 2>&1
            }
          else
            echo "GPG_KEY_ID not set, importing without GPG signing."
            flatpak build-import-bundle flatpak-repo/repo "$BUNDLE" 2>&1
            flatpak build-update-repo --generate-static-deltas flatpak-repo/repo 2>&1
          fi

          cp com.fynix.hub.flatpakrepo flatpak-repo/repo.flatpakrepo

      - name: Upload flatpak repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: flatpak-repo/

      - name: Prepare website artifact
        run: |
          mkdir -p site
          cp -r docs/* site/
          touch site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-flatpak-repo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download flatpak repo artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-repo
          path: flatpak-repo

      - name: Deploy to flatpak-repo branch
        run: |
          cd flatpak-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b flatpak-repo
          git add -A
          git commit -m "Update flatpak OSTree repo"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin flatpak-repo
