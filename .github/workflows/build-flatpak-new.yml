name: Build & Deploy Flatpak

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Flatpak SDK & runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          flatpak install --user -y flathub org.electronjs.Electron2.BaseApp//24.08 || true

      - name: Build Flatpak bundle
        run: TMPDIR=/var/tmp npm run make:flatpak

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: |
          flatpak remote-add --user --if-not-exists ghcr https://ghcr.io/v2/ || true
          mkdir -p ostree-repo
          ostree init --repo=ostree-repo --branch
          flatpak build-export ostree-repo out/make/flatpak/x86_64/*.flatpak
          flatpak build-push ghcr.io/boc86/fynix-hub --repo=ostree-repo --user --tag=latest

      - name: Prepare website artifact
        run: |
          mkdir -p site
          cp -r docs/* site/
          cat > site/flatpak-install.txt << 'EOF'
Flatpak is available on GitHub Container Registry.

Install with:
  flatpak install ghcr.io/boc86/fynix-hub

You may need to authenticate first:
  echo YOUR_GITHUB_TOKEN | flatpak remote-modify --user --password= ghcr
EOF
          touch site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
