name: Build & Deploy Flatpak

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Flatpak SDK & runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          flatpak install --user -y flathub org.electronjs.Electron2.BaseApp//24.08 || true

      - name: Build Flatpak bundle
        run: TMPDIR=/var/tmp npm run make:flatpak

      - name: Build Flatpak Repository
        run: |
          BUNDLE=$(find out/make -name "*.flatpak" | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "Error: Flatpak bundle not found in out/make"
            ls -R out/make
            exit 1
          fi
          echo "Importing bundle: $BUNDLE"
          
          mkdir -p repo
          ostree init --mode=archive-z2 --repo=repo
          flatpak build-import-bundle repo "$BUNDLE"
          
          # Sign and update the repository metadata if GPG key is provided
          if [ -n "${{ secrets.GPG_KEY_ID }}" ]; then
            echo "Importing GPG Key..."
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --passphrase "${{ secrets.GPG_PASSPHRASE }}"
            flatpak build-update-repo --gpg-sign="${{ secrets.GPG_KEY_ID }}" repo
          else
            echo "GPG key not found, skipping signature..."
            flatpak build-update-repo repo
          fi

      - name: Prepare website artifact
        run: |
          mkdir -p site
          cp -r docs/* site/
          
          # Move the OSTree repo into the website structure
          mkdir -p site/repo
          cp -r repo/* site/repo/
          
          # Generate flatpakrepo file dynamically
          echo "[Flatpak Repo]" > site/repo.flatpakrepo
          echo "Title=Fynix Hub" >> site/repo.flatpakrepo
          echo "Url=https://Boc86.github.io/Fynix-Hub/repo/" >> site/repo.flatpakrepo
          echo "HomepageURL=https://github.com/Boc86/Fynix-Hub" >> site/repo.flatpakrepo
          echo "Comment=Fynix Hub media center" >> site/repo.flatpakrepo
          echo "Description=Fynix Hub — Stream movies and shows with Real-Debrid" >> site/repo.flatpakrepo
          echo "Icon=https://Boc86.github.io/Fynix-Hub/assets/logo/logo.png" >> site/repo.flatpakrepo

          # If signed, export the GPG key to the flatpakrepo
          if [ -n "${{ secrets.GPG_KEY_ID }}" ]; then
            echo "Exporting public key to repo.flatpakrepo..."
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --passphrase "${{ secrets.GPG_PASSPHRASE }}" || true
            GPG_BASE64=$(gpg --export "${{ secrets.GPG_KEY_ID }}" | base64 -w0)
            echo "GPGKey=$GPG_BASE64" >> site/repo.flatpakrepo
            
          # Write instructions for GPG remote
            echo "Flatpak is available via our custom repository (GPG Signed)." > site/flatpak-install.txt
            echo "" >> site/flatpak-install.txt
            echo "To install, add the repository and install the app:" >> site/flatpak-install.txt
            echo "" >> site/flatpak-install.txt
            echo "1. Add repository:" >> site/flatpak-install.txt
            echo "   flatpak remote-add --if-not-exists fynix-hub https://Boc86.github.io/Fynix-Hub/repo.flatpakrepo" >> site/flatpak-install.txt
            echo "" >> site/flatpak-install.txt
            echo "2. Install app:" >> site/flatpak-install.txt
            echo "   flatpak install fynix-hub io.github.Boc86.FynixHub" >> site/flatpak-install.txt
          else
            # Unsigned remote instructions (fallback)
            echo "Flatpak is available via our custom repository." > site/flatpak-install.txt
            echo "" >> site/flatpak-install.txt
            echo "To install, add the repository and install the app:" >> site/flatpak-install.txt
            echo "" >> site/flatpak-install.txt
            echo "1. Add repository (unverified):" >> site/flatpak-install.txt
            echo "   flatpak remote-add --if-not-exists --no-gpg-verify fynix-hub https://Boc86.github.io/Fynix-Hub/repo/" >> site/flatpak-install.txt
            echo "" >> site/flatpak-install.txt
            echo "2. Install app:" >> site/flatpak-install.txt
            echo "   flatpak install fynix-hub io.github.Boc86.FynixHub" >> site/flatpak-install.txt
          fi
          touch site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
