name: Build & Deploy Flatpak

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Flatpak SDK & runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          flatpak install --user -y flathub org.electronjs.Electron2.BaseApp//24.08 || true

      - name: Build Flatpak bundle
        run: TMPDIR=/var/tmp npm run make:flatpak

      - name: Upload flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: out/make/flatpak/x86_64/*.flatpak

      - name: Prepare website artifact
        run: |
          mkdir -p site
          cp -r docs/* site/
          cp com.fynix.hub.flatpakrepo site/repo.flatpakrepo 2>/dev/null || true
          touch site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
