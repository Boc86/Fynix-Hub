name: Build & Deploy Flatpak

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Flatpak SDK & runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          flatpak install --user -y flathub org.electronjs.Electron2.BaseApp//24.08 || true

      - name: Build Flatpak bundle
        run: TMPDIR=/var/tmp npm run make:flatpak

      - name: Build Flatpak Repository
        run: |
          # Find the manifest generated by electron-forge
          MANIFEST=$(find out/make -name "manifest.json" | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "Error: Flatpak manifest not found in out/make"
            ls -R out/make
            exit 1
          fi
          echo "Building from manifest: $MANIFEST"
          
          # Build the application into a build directory
          flatpak-builder --user --force-clean build-dir "$MANIFEST"
          
          # Push the build directory into a local OSTree repository
          mkdir -p repo
          flatpak build-push --user --repo=repo build-dir
          
          # Update the repository metadata for Flatpak managers
          flatpak build-update-repo repo

      - name: Push Repository to Dedicated Repo
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git clone https://x-access-token:${REPO_TOKEN}@github.com/Boc86/fynix-hub-repo.git repo-push
          cp -r repo/* repo-push/
          cd repo-push
          git add .
          git commit -m "Update flatpak repository" || echo "No changes to commit"
          git push

      - name: Prepare website artifact
        run: |
          mkdir -p site
          cp -r docs/* site/
          echo "Flatpak is available via our custom repository." > site/flatpak-install.txt
          echo "" >> site/flatpak-install.txt
          echo "To install, add the remote and install the app:" >> site/flatpak-install.txt
          echo "" >> site/flatpak-install.txt
          echo "1. Add remote:" >> site/flatpak-install.txt
          echo "   flatpak remote-add --if-not-exists fynix-hub https://Boc86.github.io/fynix-hub-repo/" >> site/flatpak-install.txt
          echo "" >> site/flatpak-install.txt
          echo "2. Install app:" >> site/flatpak-install.txt
          echo "   flatpak install fynix-hub io.github.Boc86.FynixHub" >> site/flatpak-install.txt
          touch site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
